name: Aktualizace
 
on:
  schedule:
    - cron: '7,37 * * * *'   # každých 30 minut
  workflow_dispatch:          # tlačítko "Run workflow" pro ruční spuštění
 
permissions:
  contents: read
  pages: write
  id-token: write
 
concurrency:
  group: pages
  cancel-in-progress: true
 
jobs:
  sklad:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v5
      - name: Vytvořit sklad.json z feedu
        id: sklad
        run: python3 sklad.py
        env:
          FEED_URL: ${{ secrets.FEED_URL }}
      - uses: actions/configure-pages@v5
        if: steps.sklad.outputs.ok == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.sklad.outputs.ok == 'true'
        with:
          path: public
      - uses: actions/deploy-pages@v4
        if: steps.sklad.outputs.ok == 'true'
 
