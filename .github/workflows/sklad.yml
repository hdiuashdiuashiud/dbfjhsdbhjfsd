name: Aktualizace

on:
  schedule:
    - cron: '7,37 * * * *'   # každých 30 minut
  workflow_dispatch:          # tlačítko "Run workflow" pro ruční spuštění

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 1) stáhne feed a připraví sklad.json
  sestavit:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.sklad.outputs.ok }}
    steps:
      - uses: actions/checkout@v5
      - name: Vytvořit sklad.json z feedu
        id: sklad
        run: python3 sklad.py
        env:
          FEED_URL: ${{ secrets.FEED_URL }}
      - uses: actions/configure-pages@v5
        if: steps.sklad.outputs.ok == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.sklad.outputs.ok == 'true'
        with:
          path: public

  # 2) zveřejní ho na GitHub Pages (samostatný krok = oficiální postup GitHubu)
  zverejnit:
    needs: sestavit
    if: needs.sestavit.outputs.ok == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Zveřejnit
        id: deploy
        uses: actions/deploy-pages@v4
